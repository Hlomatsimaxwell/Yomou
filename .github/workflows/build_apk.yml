name: Build Android APK (testing)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches build_ios.yml. The two workflows building the same project
          # with different Flutter versions is how a CI-only failure starts.
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set; falling back to the debug keystore"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            "$GITHUB_WORKSPACE/android/app/release-keystore.jks" > android/key.properties
          echo "Android release signing configured"
      - name: Build Release APK
        run: flutter build apk --release

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          version=$(grep -E '^version:' pubspec.yaml | head -1 \
            | sed 's/version:[[:space:]]*//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/Yomou-${version}.apk"
          echo "path=dist/Yomou-${version}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        # upload-artifact@v7 with archive:false uploads the file as-is (no zip),
        # and the file name becomes the artifact name -- so the download is just
        # "Yomou-<version>.apk". v4 cannot do this; it always zips.
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error