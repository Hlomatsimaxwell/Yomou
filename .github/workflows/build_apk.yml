name: Build Android APK (testing)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Matches build_ios.yml. The two workflows building the same project
          # with different Flutter versions is how a CI-only failure starts.
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to build a debug-signed release"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
            "$GITHUB_WORKSPACE/android/app/release-keystore.jks" > android/key.properties
          echo "Android release signing configured"
      - name: Build Release APK (universal)
        # The "works on everything" APK: arm64 + armeabi-v7a + x86_64 in one
        # file, native libs stored uncompressed, hence ~78 MB.
        run: flutter build apk --release

      - name: Build Release APKs (per-ABI)
        # One APK per CPU architecture, for smaller downloads. The universal
        # fat APK above survives alongside these in the outputs dir.
        run: flutter build apk --release --split-per-abi

      - name: Name the APKs
        id: apk
        run: |
          set -euo pipefail
          version=$(grep -E '^version:' pubspec.yaml | head -1 \
            | sed 's/version:[[:space:]]*//; s/+.*//')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/1-Yomou-${version}-universal.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/2-Yomou-${version}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "dist/3-Yomou-${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "dist/4-Yomou-${version}-x86_64.apk"
          echo "universal=dist/1-Yomou-${version}-universal.apk" >> "$GITHUB_OUTPUT"
          echo "arm64=dist/2-Yomou-${version}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "armv7=dist/3-Yomou-${version}-armeabi-v7a.apk" >> "$GITHUB_OUTPUT"
          echo "x64=dist/4-Yomou-${version}-x86_64.apk" >> "$GITHUB_OUTPUT"

      - name: Verify release signing
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          for apk in dist/[1-9]-Yomou-*.apk; do
            DN=$("$SIGNER" verify --print-certs "$apk" | grep -i 'certificate DN' | head -1)
            echo "$apk -> $DN"
            echo "$DN" | grep -q "CN=Yomou" || { echo "::error::$apk is not signed with the release key"; exit 1; }
          done

      - name: Upload Universal APK Artifact
        # upload-artifact@v7 with archive:false uploads the file as-is (no zip),
        # and the file name becomes the artifact name -- so the download is just
        # "Yomou-<version>-universal.apk". v4 cannot do this; it always zips.
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.universal }}
          archive: false
          if-no-files-found: error

      - name: Upload arm64 APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.arm64 }}
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.armv7 }}
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 APK Artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.x64 }}
          archive: false
          if-no-files-found: error