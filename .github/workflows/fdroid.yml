name: F-Droid personal repo publish

# Publishes a build to your personal F-Droid repository on every version tag.
# Setup (one-time):
#   1. Create a public GitHub repo named `fdroid-repo` (or change FDROID_REPO below).
#   2. Add a repo secret `FDROID_REPO_PAT`: a fine-grained PAT with contents:write
#      on the fdroid-repo repository.
#   3. (Optional) Add a keystore secret if you want to re-sign APKs; by default
#      the repo uses its own self-signed key generated on first run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FDROID_REPO: Hlomatsimaxwell/fdroid-repo
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Prepare F-Droid repo identity
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p fdroid/repo fdroid/metadata
          cp build/app/outputs/flutter-apk/app-release.apk fdroid/repo/
          cd fdroid
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/fdroid-keystore.tar.gz
            tar -xzf /tmp/fdroid-keystore.tar.gz
            echo "Restored existing F-Droid repo signing key"
          else
            fdroid init
            echo "WARNING: generated a NEW signing key. Download 'fdroid' dir as artifact and store it as FDROID_REPO_KEYSTORE_BASE64 (base64 of tar.gz of the fdroid dir) for future runs, or updates will be unsigned differently and F-Droid clients will reject them."
          fi
          fdroid update

      - name: Upload fdroid repo state (save keystore on first run)
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-repo-state
          path: fdroid/
          if-no-files-found: ignore
          retention-days: 30
        env:
          PAT: ${{ secrets.FDROID_REPO_PAT }}
        run: |
          set -euo pipefail
          git config --global user.email "fdroid@yomou"
          git config --global user.name "Yomou F-Droid bot"
          rm -rf fdroid-repo
          git clone "https://x-access-token:${PAT}@github.com/${{ env.FDROID_REPO }}.git" fdroid-repo
          # Mirror this build's repo contents into the published repo.
          rsync -a --delete fdroid/repo/ fdroid-repo/repo/
          cp -f fdroid/index* fdroid-repo/ 2>/dev/null || true
          cd fdroid-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update Yomou ${GITHUB_REF_NAME}"
            git push
          fi

      - name: Print repo URL for users
        run: |
          echo "Users can add this repo in F-Droid:"
          echo "https://raw.githubusercontent.com/${{ env.FDROID_REPO }}/main/repo/"