name: F-Droid personal repo publish

# Publishes a build to your personal F-Droid repository.
#
# Triggers: a pushed version tag (`v*`) or manual run (Actions tab -> Run workflow).
#
# NOTE: for the very first run to inherit a stable signing key, add the secret
# FDROID_REPO_KEYSTORE_BASE64 (see FDROID_SETUP.md). Without it, `fdroid init`
# mints a throw-away key and later clients will reject updates.
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  FDROID_REPO: Hlomatsimaxwell/fdroid-repo
  FLUTTER_VERSION: '3.47.5'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Install fdroidserver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fdroidserver

      - name: Prepare fdroid repository
        env:
          KEYSTORE_B64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          rm -rf fdroid
          mkdir -p fdroid/repo
          cp build/app/outputs/flutter-apk/app-release.apk fdroid/repo/
          cd fdroid
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > /tmp/fdroid-keystore.tar.gz
            tar -xzf /tmp/fdroid-keystore.tar.gz
            echo "Restored existing signing key"
          else
            fdroid init
            echo "::warning::Generated a throw-away signing key. Save fdroid/ as FDROID_REPO_KEYSTORE_BASE64 (base64 of tar.gz) for future runs."
          fi
          fdroid update

      - name: Upload fdroid state (save on first run)
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-repo-state
          path: fdroid/
          if-no-files-found: ignore

      - name: Push to personal F-Droid repo
        env:
          PAT: ${{ secrets.FDROID_REPO_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::error::FDROID_REPO_PAT secret is not set"
            exit 1
          fi
          git config --global user.email "fdroid@yomou"
          git config --global user.name "Yomou F-Droid bot"
          rm -rf published
          git clone "https://x-access-token:${PAT}@github.com/${{ env.FDROID_REPO }}.git" published
          rsync -a --delete fdroid/repo/ published/repo/
          cp -f fdroid/index-v1.jar published/ 2>/dev/null || true
          cp -f fdroid/index.xml published/ 2>/dev/null || true
          cd published
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update Yomou ${GITHUB_REF_NAME}"
            git push
          fi

      - name: Print repo URL
        run: |
          echo "Users add this repo in F-Droid:"
          echo "https://raw.githubusercontent.com/${{ env.FDROID_REPO }}/main/repo/"